[package]
name = "waas-benchmark-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# keep this crate out of any parent workspace
[workspace]
