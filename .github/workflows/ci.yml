name: CI

on:
  push:
  pull_request:

jobs:
  dotnet-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WaaS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # the component tests build a Rust guest and componentize it with wasm-tools
      - name: Install the Rust target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Test
        run: dotnet test WaaS.Tests -c Release

  # loads and runs random modules, with a different seed on each run
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WaaS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Fuzz
        # the seed is printed so that a failure can be reproduced
        run: |
          seed=$(( ${{ github.run_id }} % 2147483647 ))
          echo "seed: $seed"
          dotnet run --project WaaS.Fuzz -c Release -- -n 500 -m 20 -s "$seed" -o "${{ runner.temp }}/fuzz-failures"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures

  wukuro-crates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Wukuro
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Build
        run: cargo build --locked --target wasm32-unknown-unknown
      # checks that the packages include the files needed to build them, such as the WIT
      - name: Publish (dry run)
        run: cargo publish --workspace --dry-run --locked

  wukuro-moonbit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Wukuro/moonbit/wukuro
    steps:
      - uses: actions/checkout@v7
      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check
        run: moon check --target wasm

  rust-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [wit2waas, waas-unity-native-editor]
    defaults:
      run:
        working-directory: WaaS/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --locked

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that all distributions have the same version
        run: |
          version=$(python scripts/version.py show | head -n 1 | cut -f 1)
          python scripts/version.py check "$version"
