name: Publish NuGet

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-nuget:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WaaS
    steps:
      - uses: actions/checkout@v4
      - name: get tag name
        run: echo "VERSION=${GITHUB_REF_NAME##*v}" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release -p:Version=${{ env.VERSION }} --no-restore -o ./publish
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push ./publish/WaaS*.${{ env.VERSION }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json